<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Technical writing on backends, Kotlin Multiplatform, and SQLite by Hassan Mohamed.">
    <title>Articles — Hassan Mohamed</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="sysbar">
        <div class="sysbar-inner">
            <span>SYS.HMH — PORTFOLIO / v2.1</span>
            <span><span class="dot"></span>WRITING: BACKENDS · KMP · SQLITE</span>
        </div>
    </div>

    <input type="checkbox" id="menu-toggle" class="menu-toggle">
    <header>
        <div class="header-inner">
            <a href="about.html" class="brand"><span class="brand-mark">HM</span><span class="brand-name">Hassan Mohamed <span>/ sys.builder</span></span></a>
            <label for="menu-toggle" class="menu-btn" aria-label="Menu"><span></span><span></span><span></span></label>
            <nav>
                <a href="about.html">About</a>
                <a href="projects.html">Projects</a>
                <a href="articles.html" class="active">Articles</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <span class="label">Writing</span>
            <h1>Articles</h1>
            <div class="path">~/articles — engineering notes, no filler</div>
        </div>
        <div class="articles-table" id="articles-grid">
            <div class="loading-msg" style="padding:1.5rem">Loading articles…</div>
        </div>
        <div class="pagination" id="pagination"></div>
        <div class="article-view" id="article-view">
            <span class="back" id="back-btn">← Back to articles</span>
            <div class="article-header" id="article-header"></div>
            <div class="article-body" id="article-content"></div>
        </div>
    </div>

    <footer>
        <div class="footer-inner">
            <span>© 2026 HASSAN MOHAMED</span>
            <span><a href="about.html" style="color:inherit">~/about</a> · <a href="projects.html" style="color:inherit">~/projects</a></span>
        </div>
    </footer>

    <script>
    (function() {
        var grid = document.getElementById("articles-grid");
        var view = document.getElementById("article-view");
        var headerEl = document.getElementById("article-header");
        var contentEl = document.getElementById("article-content");
        var paginationEl = document.getElementById("pagination");
        var backBtn = document.getElementById("back-btn");

        var PER_PAGE = 10;
        var currentPage = 1;
        var articles = [];
        var totalPages = 0;

        function esc(s) {
            return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
        function formatDate(d) {
            return new Date(d).toLocaleDateString("en-US", { year: "numeric", month: "short", day: "2-digit" }).toUpperCase();
        }
        function extractTitle(md) {
            var match = md.match(/^#\s+(.+)/m);
            return match ? match[1].trim() : "Untitled";
        }
        function readMins(md) {
            var words = md.trim().split(/\s+/).length;
            return Math.max(1, Math.round(words / 200));
        }
        function getExcerpt(md) {
            var lines = md.split("\n");
            for (var i = 0; i < lines.length; i++) {
                var l = lines[i].trim();
                if (l && l.charAt(0) !== "#" && l.substring(0, 3) !== "```" && l.charAt(0) !== "|" && l.charAt(0) !== "-" && l.charAt(0) !== "!" && l.length > 15) {
                    return l.substring(0, 140);
                }
            }
            return "";
        }
        function highlightCodeblocks(container) {
            var pres = container.querySelectorAll("pre code");
            for (var i = 0; i < pres.length; i++) {
                var code = pres[i];
                var lang = "";
                var m = code.className.match(/language-(\w+)/);
                if (m) lang = m[1];
                var header = document.createElement("div");
                header.className = "code-header";
                var badge = document.createElement("span");
                badge.className = "lang-badge";
                badge.textContent = lang || "code";
                var left = document.createElement("span");
                left.textContent = "code";
                header.appendChild(left);
                header.appendChild(badge);
                code.parentNode.insertBefore(header, code);
                if (window.hljs) hljs.highlightElement(code);
            }
        }
        function renderGrid() {
            var start = (currentPage - 1) * PER_PAGE;
            var pageArticles = articles.slice(start, start + PER_PAGE);
            var html = "";
            for (var i = 0; i < pageArticles.length; i++) {
                var a = pageArticles[i];
                var idx = start + i;
                html += '<div class="article-row" data-idx="' + idx + '" role="link" tabindex="0">';
                html += '<span class="date">' + formatDate(a.date) + '</span>';
                html += '<div><h3>' + esc(a.title) + '</h3>';
                html += '<p>' + esc(getExcerpt(a.content)) + '…</p>';
                html += '<div class="tags">';
                for (var t = 0; t < a.tags.length; t++) {
                    html += '<span class="article-tag">' + esc(a.tags[t]) + '</span>';
                }
                html += '</div></div>';
                html += '<span class="meta">' + a.mins + ' MIN</span>';
                html += '</div>';
            }
            grid.innerHTML = html;
            var cards = grid.querySelectorAll(".article-row");
            for (var c = 0; c < cards.length; c++) {
                (function(el) {
                    el.addEventListener("click", function() { openArticle(parseInt(el.getAttribute("data-idx"))); });
                    el.addEventListener("keydown", function(e) { if (e.key === "Enter") openArticle(parseInt(el.getAttribute("data-idx"))); });
                })(cards[c]);
            }
            renderPagination();
        }
        function renderPagination() {
            if (totalPages <= 1) { paginationEl.innerHTML = ""; return; }
            var html = '<button data-page="' + (currentPage - 1) + '"' + (currentPage === 1 ? ' disabled' : '') + '>← Prev</button>';
            for (var p = 1; p <= totalPages; p++) {
                html += '<button data-page="' + p + '"' + (p === currentPage ? ' class="active"' : '') + '>' + p + '</button>';
            }
            html += '<button data-page="' + (currentPage + 1) + '"' + (currentPage === totalPages ? ' disabled' : '') + '>Next →</button>';
            paginationEl.innerHTML = html;
            var btns = paginationEl.querySelectorAll("button");
            for (var b = 0; b < btns.length; b++) {
                btns[b].addEventListener("click", function() {
                    var pg = parseInt(this.getAttribute("data-page"));
                    if (!isNaN(pg) && pg >= 1 && pg <= totalPages) {
                        currentPage = pg;
                        renderGrid();
                        window.scrollTo({ top: 0, behavior: "smooth" });
                    }
                });
            }
        }
        function openArticle(i) {
            var a = articles[i];
            headerEl.innerHTML = '<h1>' + esc(a.title) + '</h1><div class="article-meta"><span>' + formatDate(a.date) + '</span><span>' + esc(a.tags.join(" / ")) + '</span><span>' + a.mins + ' min read</span></div>';
            contentEl.innerHTML = marked.parse(a.content);
            highlightCodeblocks(contentEl);
            grid.style.display = "none";
            paginationEl.style.display = "none";
            view.classList.add("active");
            window.scrollTo({ top: 0, behavior: "smooth" });
        }
        function showGrid() {
            view.classList.remove("active");
            grid.style.display = "";
            paginationEl.style.display = "";
        }
        backBtn.addEventListener("click", showGrid);
        async function loadArticles() {
            try {
                var res = await fetch("articles/manifest.json");
                var manifest = await res.json();
                var loaded = [];
                for (var i = 0; i < manifest.length; i++) {
                    var item = manifest[i];
                    try {
                        var mdRes = await fetch("articles/" + item.file);
                        var md = await mdRes.text();
                        loaded.push({ title: extractTitle(md), date: item.date, tags: item.tags || [], content: md, mins: readMins(md) });
                    } catch (e) { console.warn("Failed to load:", item.file); }
                }
                articles = loaded.sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
                totalPages = Math.ceil(articles.length / PER_PAGE);
                renderGrid();
            } catch (e) {
                grid.innerHTML = '<div class="loading-msg" style="padding:1.5rem">Failed to load articles. Use a local server or deploy to GitHub Pages.</div>';
            }
        }
        loadArticles();
    })();
    </script>
</body>
</html>
